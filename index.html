<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AoE2 Build Order</title>
  <style>
    :root {
      --bg:        #0f0f0f;
      --surface:   #1a1a1a;
      --surface2:  #242424;
      --border:    #333;
      --accent:    #c89648;
      --accent-dim:#7a5a28;
      --text:      #e8e8e8;
      --text-dim:  #888;
      --error:     #e05c5c;
      --blue:      #5b9bd5;
      --green:     #5cb85c;
      --purple:    #9b59b6;
      --radius:    12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      min-height: 100dvh;
      padding-bottom: 40px;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 0 20px; }

    header { padding: 36px 0 28px; text-align: center; }
    header h1 {
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    header p { margin-top: 6px; font-size: 14px; color: var(--text-dim); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 20px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 13px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-dim); margin-bottom: 14px;
    }

    label { display: block; font-size: 14px; font-weight: 500; color: var(--text-dim); margin-bottom: 8px; }

    input[type="file"] {
      width: 100%;
      background: var(--surface2);
      border: 2px dashed var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 15px;
      padding: 20px 14px;
      cursor: pointer;
      -webkit-appearance: none;
      display: block;
    }
    input[type="file"]::file-selector-button {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      margin-right: 12px;
      padding: 8px 14px;
    }
    .hint { margin-top: 8px; font-size: 12px; color: var(--text-dim); }

    button {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #0f0f0f;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      min-height: 52px;
      padding: 0 24px;
      touch-action: manipulation;
      transition: opacity 0.15s;
      width: 100%;
      margin-top: 14px;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { opacity: 0.8; }
    button:disabled { background: var(--accent-dim); cursor: not-allowed; opacity: 0.6; }
    .btn-secondary {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 500;
    }
    .btn-secondary:active { background: var(--border); }

    #loading-section { text-align: center; padding: 48px 0; }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.8s linear infinite;
    }
    #loading-text { color: var(--text-dim); font-size: 15px; }

    #error-section {
      background: color-mix(in srgb, var(--error) 10%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--error) 35%, transparent);
      border-radius: var(--radius);
      padding: 22px 20px;
      margin-bottom: 16px;
    }
    #error-message { color: var(--error); font-size: 15px; line-height: 1.6; margin-bottom: 14px; }

    /* ── Player summary cards ── */
    .player-cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 480px) { .player-cards-grid { grid-template-columns: 1fr; } }

    .player-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
    }
    .player-card.fastest { border-color: var(--accent); }

    .badge {
      display: inline-block;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 20px;
      margin-bottom: 10px;
      align-self: flex-start;
    }
    .badge-gold { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); border: 1px solid var(--accent-dim); }
    .badge-dim  { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }

    .player-name { font-size: 17px; font-weight: 700; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .player-civ  { font-size: 13px; color: var(--text-dim); margin-bottom: 14px; }

    .age-times { display: flex; gap: 14px; margin-top: auto; }
    .age-time-col { flex: 1; }
    .age-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 2px; }
    .age-value { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
    .age-value.has-time { color: var(--accent); }
    .age-value.castle   { color: var(--blue); }
    .age-value.no-time  { color: var(--text-dim); font-size: 18px; }

    /* ── Build order section ── */
    .section-label {
      font-size: 13px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-dim);
      margin: 20px 0 10px;
    }
    .build-orders-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 480px) { .build-orders-grid { grid-template-columns: 1fr; } }

    .bo-col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .bo-col-header {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .bo-col-meta { font-size: 11px; font-weight: 400; color: var(--text-dim); }
    .bo-list {
      max-height: 440px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .bo-entry {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 5px 14px;
      font-size: 13px;
      border-left: 3px solid transparent;
    }
    .bo-entry + .bo-entry { border-top: 1px solid color-mix(in srgb, var(--border) 50%, transparent); }
    .bo-age      { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); font-weight: 700; color: var(--accent); }
    .bo-tech     { border-left-color: var(--blue); }
    .bo-unit     { border-left-color: var(--green); }
    .bo-building { border-left-color: var(--purple); }
    .bo-time     { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; min-width: 32px; flex-shrink: 0; }
    .bo-name     { flex: 1; }
    .bo-amount   { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }

    .bo-empty {
      padding: 20px 14px;
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot  { width: 10px; height: 10px; border-radius: 50%; }

    .result-meta { font-size: 12px; color: var(--text-dim); text-align: center; margin-bottom: 12px; }
    .hidden { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>AoE2 Build Order</h1>
    <p>Upload a replay to see each player's build order up to Castle Age</p>
  </header>

    <h2>Upload Replay File</h2>
    <label for="file-input">Select .aoe2record or .zip file</label>

    <p class="hint">Parsed locally — your file is never uploaded anywhere</p>
    <button id="analyze-btn">Analyze Replay</button>
  </div>

  <div id="loading-section" class="hidden">
    <div class="spinner"></div>
    <p id="loading-text">Reading file…</p>
  </div>

  <div id="error-section" class="hidden">
    <p id="error-message"></p>
    <button class="btn-secondary" id="back-btn">← Try Another File</button>
  </div>

  <div id="results-section" class="hidden">
    <div class="player-cards-grid" id="player-cards"></div>
    <p class="section-label">Build Orders</p>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span> Age-up</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--green)"></span> Unit trained</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--purple)"></span> Building placed</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--blue)"></span> Tech researched</span>
    </div>
    <div class="build-orders-grid" id="build-orders"></div>
    <p class="result-meta" id="result-meta"></p>
    <button class="btn-secondary" id="again-btn">← Analyze Another</button>
  </div>

</div>

let _msgInterval = null;
function startLoading() {

    i = (i + 1) % LOADING_MSGS.length;
    loadingText.textContent = LOADING_MSGS[i];
  }, 1400);
}

function stopLoading() {
  clearInterval(_msgInterval);
  analyzeBtn.disabled = false;
}

function showError(msg) {
  stopLoading();
  loadingSection.classList.add('hidden');
  errorMessage.textContent = msg;
  errorSection.classList.remove('hidden');
  uploadSection.classList.remove('hidden');
}

// ── File handling ─────────────────────────────────────────────────────────────
async function handleAnalyze() {
  const file = fileInput.files[0];
  if (!file) {
    fileInput.style.borderColor = 'var(--error)';
    setTimeout(() => fileInput.style.borderColor = '', 1500);
    return;
  }
  startLoading();
  try {
    const buf = await file.arrayBuffer();
    let recordBuf = buf;
    if (isZip(buf)) recordBuf = await extractFromZip(buf);
    const result = await parseReplay(recordBuf);
    stopLoading();
    renderResults(result);
  } catch(e) {
    showError(e.message || String(e));
  }
}

function isZip(buf) {
  const b = new Uint8Array(buf, 0, 4);
  return b[0]===0x50 && b[1]===0x4B && b[2]===0x03 && b[3]===0x04;
}

async function extractFromZip(buf) {
  const bytes = new Uint8Array(buf);
  const view = new DataView(buf);
  for (let i = 0; i < bytes.length - 30; i++) {
    if (bytes[i]===0x50 && bytes[i+1]===0x4B && bytes[i+2]===0x03 && bytes[i+3]===0x04) {
      const compression     = view.getUint16(i + 8, true);
      const compressedSize  = view.getUint32(i + 18, true);
      const uncompressedSize = view.getUint32(i + 22, true);
      const fnameLen        = view.getUint16(i + 26, true);
      const extraLen        = view.getUint16(i + 28, true);
      const dataOffset      = i + 30 + fnameLen + extraLen;
      const fname = new TextDecoder().decode(bytes.slice(i + 30, i + 30 + fnameLen)).toLowerCase();
      if (fname.endsWith('.aoe2record') || fname.endsWith('.mgz')) {
        const entryData = bytes.slice(dataOffset, dataOffset + compressedSize);
        if (compression === 0) {
          return entryData.buffer.slice(entryData.byteOffset, entryData.byteOffset + entryData.byteLength);
        } else if (compression === 8) {
          const ds = new DecompressionStream('deflate-raw');
          const writer = ds.writable.getWriter();
          const reader = ds.readable.getReader();
          writer.write(entryData);
          writer.close();
          return await readAllChunks(reader, uncompressedSize);
        }
        throw new Error(`Unsupported ZIP compression ${compression}`);
      }
    }
  }
  throw new Error('No .aoe2record file found inside the ZIP');
}

async function readAllChunks(reader) {
  const chunks = [];
  let total = 0;
  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    chunks.push(value);
    total += value.length;
  }
  const out = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out.buffer;
}

// ── AoE2 Replay Parser ────────────────────────────────────────────────────────
async function parseReplay(buf) {
  const bytes = new Uint8Array(buf);
  const view  = new DataView(buf);
  const size  = buf.byteLength;

  if (size < 8) throw new Error('File too small to be a valid replay');

  const headerLen = view.getUint32(0, true);
  if (headerLen >= size) throw new Error(`Invalid header length ${headerLen}`);

  let players = [];
  try {
    players = await extractPlayerInfo(bytes.slice(8, headerLen));
  } catch(_) {}

  const opsStart = skipMeta(view, headerLen, size);
  const opsResult = parseOps(view, bytes, opsStart, size);
  return buildResult(players, opsResult);
}

// ── META section skip ─────────────────────────────────────────────────────────
function skipMeta(view, offset, size) {
  if (offset + 40 > size) return offset;
  const first = view.getUint32(offset, true);
  let pos = offset + 4;
  if (first !== 500) pos += 4;
  pos += 20;
  if (pos + 12 > size) return pos;
  const a = view.getUint32(pos, true);
  const b = view.getUint32(pos + 4, true);
  pos += 12;
  if (a !== 0) pos -= 12;
  if (b === 2) pos -= 8;
  return pos;
}

// ── SYNC size calculation ─────────────────────────────────────────────────────
function syncSize(view, offset, bufSize) {
  if (offset + 8 > bufSize) return { inc: 0, size: 4 };
  const inc    = view.getUint32(offset,     true);
  const marker = view.getUint32(offset + 4, true);
  if (marker !== 0) return { inc, size: 4 };
  if (offset + 24 > bufSize) return { inc, size: 32 };
  const is_de = view.getUint32(offset + 20, true);
  if (!is_de) return { inc, size: 32 };
  return { inc, size: 364 };
}

// ── Operation loop ────────────────────────────────────────────────────────────
function parseOps(view, bytes, start, size) {
  let offset = start;
  let timeMs = 0;
  const feudalTimes  = {};  // player_id -> ms
  const feudalPops   = {};  // player_id -> "pop/cap" string at feudal click
  const castleTimes  = {};  // player_id -> ms
  const buildOrders  = {};  // player_id -> [{time_ms, type, id, name, amount}]

  // Per-building production queue: pid -> buildingKey -> sorted array of unit finish times
  const bQueues = {};

  // Resource state per player: food, wood, gold, stone, lastTime, vills (total gatherers)
  // Start: 200 food, 200 wood, 3 starting villagers assumed gathering
  const res = {};
  // Population per player: pop (units alive), cap (from TC + houses)
  const pop = {};

  function initPlayer(pid) {
    if (!res[pid]) {
      res[pid] = { food: 200, wood: 200, gold: 0, stone: 0, lastTime: 0, vills: 3 };
      pop[pid] = { pop: 3, cap: 5 };  // 3 starting vills, 1 TC = 5 cap
    }
  }

  function advanceRes(pid, toMs) {
    const r = res[pid];
    const dt = toMs - r.lastTime;
    if (dt <= 0) return;
    // Simplified gather: vills split ~60% food / 40% wood at base rates
    // 20 food/min/vill, 18 wood/min/vill  → /60000 ms
    r.food += r.vills * 0.6 * 20 / 60000 * dt;
    r.wood += r.vills * 0.4 * 18 / 60000 * dt;
    r.lastTime = toMs;
  }

  function canAfford(pid, cost, n) {
    const r = res[pid];
    return r.food >= cost[0]*n && r.wood >= cost[1]*n && r.gold >= cost[2]*n && r.stone >= cost[3]*n;
  }

  function spend(pid, cost, n) {
    const r = res[pid];
    r.food  = Math.max(0, r.food  - cost[0]*n);
    r.wood  = Math.max(0, r.wood  - cost[1]*n);
    r.gold  = Math.max(0, r.gold  - cost[2]*n);
    r.stone = Math.max(0, r.stone - cost[3]*n);
  }

  // Returns how many units were actually accepted into the queue (0 = full, spam rejected).
  function tryQueue(pid, bKey, unitId, wantAmount, now) {
    if (!bQueues[pid]) bQueues[pid] = {};
    if (!bQueues[pid][bKey]) bQueues[pid][bKey] = [];
    const q = bQueues[pid][bKey];
    const trainMs = TRAIN_MS[unitId] || 32000;
    while (q.length > 0 && q[0] <= now) q.shift();
    const slots = 10 - q.length;
    if (slots <= 0) return 0;
    const actual = Math.min(wantAmount, slots);
    for (let k = 0; k < actual; k++) {
      const prev = q.length > 0 ? q[q.length - 1] : now;
      q.push(prev + trainMs);
    }
    return actual;
  }

  function add(pid, ev) {
    if (!buildOrders[pid]) buildOrders[pid] = [];
    buildOrders[pid].push(ev);
  }

  outer: while (offset + 4 < size) {
    const opType = view.getUint32(offset, true);
    offset += 4;

    switch (opType) {
      case 1: {  // ACTION
        if (offset + 4 > size) break outer;
        const length = view.getUint32(offset, true);
        offset += 4;
        if (length < 1 || offset + length + 4 > size) break outer;

        const actionId = bytes[offset];
        const abStart  = offset + 1;   // action_bytes start (after action type byte)
        const abLen    = length - 1;   // action_bytes length

        // DE-71094 detection: action_bytes = [player_id:1][inner_len:2][raw:inner_len]
        // so inner_len + 3 === abLen
        const innerLen  = abLen >= 3 ? view.getInt16(abStart + 1, true) : -1;
        const isDE71094 = abLen >= 3 && innerLen >= 0 && (innerLen + 3) === abLen;

        // ── RESEARCH (0x65) ──
        if (actionId === 0x65 && abLen >= 10) {
          let pid, tech_id;
          if (isDE71094) {
            pid     = view.getInt8(abStart);
            tech_id = view.getInt16(abStart + 9, true);
          } else {
            pid     = view.getInt16(abStart + 7, true);
            tech_id = abLen >= 19 ? view.getUint32(abStart + 11, true)
                                  : view.getInt16(abStart + 9,  true);
          }
          if (pid > 0 && pid <= 8 && tech_id > 0) {
            initPlayer(pid);
            advanceRes(pid, timeMs);
            const beforeCastle = !(pid in castleTimes);
            const cost = TECH_COSTS[tech_id] || [300,0,0,0];
            if (beforeCastle && canAfford(pid, cost, 1)) {
              spend(pid, cost, 1);
              const isAge = tech_id === 101 || tech_id === 102 || tech_id === 103;
              add(pid, {
                time_ms: timeMs, type: isAge ? 'age' : 'tech',
                id: tech_id, name: TECHS[tech_id] || `Tech #${tech_id}`, amount: 1,
              });
              if (tech_id === 101 && !(pid in feudalTimes)) {
                feudalTimes[pid] = timeMs;
                feudalPops[pid]  = `${pop[pid].pop}/${pop[pid].cap}`;
              }
              if (tech_id === 102 && !(pid in castleTimes)) castleTimes[pid] = timeMs;
            } else if (!beforeCastle) {
              // still record age-up click times even if we're past castle
              if (tech_id === 101 && !(pid in feudalTimes)) {
                feudalTimes[pid] = timeMs;
                feudalPops[pid]  = `${pop[pid].pop}/${pop[pid].cap}`;
              }
              if (tech_id === 102 && !(pid in castleTimes)) castleTimes[pid] = timeMs;
            }
          }
        }

        // ── BUILD (0x66) — DE-71094 only ──
        else if (actionId === 0x66 && isDE71094 && abLen >= 19) {
          const pid = view.getInt8(abStart);
          if (pid > 0 && pid <= 8 && !(pid in castleTimes)) {
            initPlayer(pid);
            advanceRes(pid, timeMs);
            const building_id = view.getUint32(abStart + 15, true);
            if (building_id > 0 && building_id < 5000) {
              const cost = BUILDING_COSTS[building_id] || [0,75,0,0];
              if (canAfford(pid, cost, 1)) {
                spend(pid, cost, 1);
                if (building_id === 70) pop[pid].cap += 5;  // House: +5 pop cap
                add(pid, {
                  time_ms: timeMs, type: 'building',
                  id: building_id, name: BUILDINGS[building_id] || `Building #${building_id}`, amount: 1,
                });
              }
            }
          }
        }

        // ── DE_QUEUE (0x81) — DE-71094 only ──
        else if (actionId === 0x81 && isDE71094 && abLen >= 16) {
          const pid = view.getInt8(abStart);
          if (pid > 0 && pid <= 8 && !(pid in castleTimes)) {
            initPlayer(pid);
            advanceRes(pid, timeMs);
            const selected = Math.max(0, view.getInt16(abStart + 3, true));
            const unit_id  = view.getInt16(abStart + 11, true);
            const want     = Math.max(1, view.getInt16(abStart + 13, true));
            if (unit_id > 0 && unit_id < 3000) {
              const cost = UNIT_COSTS[unit_id] || [60,0,0,0];
              if (canAfford(pid, cost, want) && pop[pid].pop < pop[pid].cap) {
                let totalActual = 0;
                const nBuildings = selected > 0 ? selected : 1;
                for (let bi = 0; bi < nBuildings; bi++) {
                  const bOff = abStart + 19 + bi * 4;
                  const bKey = (selected > 0 && bOff + 4 <= offset + length)
                    ? view.getUint32(bOff, true)
                    : (pid * 100 + bi);
                  totalActual += tryQueue(pid, bKey, unit_id, want, timeMs);
                }
                if (totalActual > 0) {
                  spend(pid, cost, totalActual);
                  pop[pid].pop += totalActual;
                  if (unit_id === 83) res[pid].vills += totalActual;  // new vills gather
                  add(pid, {
                    time_ms: timeMs, type: 'unit',
                    id: unit_id, name: UNITS[unit_id] || `Unit #${unit_id}`, amount: totalActual,
                  });
                }
              }
            }
          }
        }

        // ── MAKE (0x64) — DE-71094 only ──
        else if (actionId === 0x64 && isDE71094 && abLen >= 13) {
          const pid = view.getInt8(abStart);
          if (pid > 0 && pid <= 8 && !(pid in castleTimes)) {
            initPlayer(pid);
            advanceRes(pid, timeMs);
            const bType   = view.getUint16(abStart + 3, true);
            const unit_id = view.getInt16(abStart + 11, true);
            if (unit_id > 0 && unit_id < 3000) {
              const cost = UNIT_COSTS[unit_id] || [60,0,0,0];
              if (canAfford(pid, cost, 1) && pop[pid].pop < pop[pid].cap) {
                const bKey   = pid * 10000 + bType;
                const actual = tryQueue(pid, bKey, unit_id, 1, timeMs);
                if (actual > 0) {
                  spend(pid, cost, actual);
                  pop[pid].pop += actual;
                  if (unit_id === 83) res[pid].vills += actual;
                  add(pid, {
                    time_ms: timeMs, type: 'unit',
                    id: unit_id, name: UNITS[unit_id] || `Unit #${unit_id}`, amount: 1,
                  });
                }
              }
            }
          }
        }

        offset += length;
        offset += 4;
        break;
      }

      case 2: {  // SYNC
        const { inc, size: sz } = syncSize(view, offset, size);
        timeMs += inc;
        offset += sz;
        break;
      }

      case 3: {  // VIEWLOCK: x(f) + y(f) + unk(I) = 12 bytes
        offset += 12;
        break;
      }

      case 4: {  // CHAT
        if (offset + 8 > size) break outer;
        const msgLen = view.getUint32(offset + 4, true);
        offset += 8 + msgLen;
        break;
      }

      case 5:   // POSTGAME — end of meaningful data
        break outer;

      default:
        break outer;
    }
  }

  return { feudalTimes, feudalPops, castleTimes, buildOrders };
}

// ── Player info from compressed header ───────────────────────────────────────
async function extractPlayerInfo(compressed) {
  const ds = new DecompressionStream('deflate-raw');
  const writer = ds.writable.getWriter();
  const reader = ds.readable.getReader();
  writer.write(compressed);
  writer.close();
  const decompBuf  = await readAllChunks(reader);
  const decompressed = new Uint8Array(decompBuf);
  const dv = new DataView(decompBuf);

  const strings = [];
  for (let i = 0; i + 4 < decompressed.length; i++) {
    if (decompressed[i] === 0x60 && decompressed[i + 1] === 0x0A) {
      const len = dv.getUint16(i + 2, true);
      if (len > 0 && len < 64 && i + 4 + len <= decompressed.length) {
        const strBytes = decompressed.slice(i + 4, i + 4 + len);
        if (strBytes.every(b => b >= 32 && b < 128)) {
          strings.push(new TextDecoder().decode(strBytes).trim());
        }
      }
    }
  }

  const SKIP = new Set(['Gaia', 'GAIA', '', 'MP Random', 'Random', 'Scenario',
    'Regicide', 'King of the Hill', 'Wonder Race', 'Defend the Wonder',
    'Turbo Random Map', 'Capture the Relic', 'Sudden Death', 'Fortress',
    'Empire Wars', 'Battle on Ice', 'Nomad', 'Arabia', 'Arena']);
  const names = strings.filter(s =>
    s.length >= 2 && s.length < 40 && !SKIP.has(s) &&
    !s.startsWith('SUBSCRIBEDMODS') && !s.includes(':') &&
    !/^[\d.]+$/.test(s)
  );

  const seen = new Set();
  const result = [];
  for (const n of names) {
    if (!seen.has(n)) {
      seen.add(n);
      result.push({ name: n, civilization_id: 0 });
      if (result.length === 2) break;
    }
  }
  return result;
}

// ── Result builder ────────────────────────────────────────────────────────────
function buildResult(players, { feudalTimes, feudalPops, castleTimes, buildOrders }) {
  const allPids = [...new Set([
    ...Object.keys(feudalTimes).map(Number),
    ...Object.keys(buildOrders).map(Number),
  ])].sort();

  if (allPids.length === 0 && players.length === 0)
    return { players: [] };

  const resultPlayers = allPids.map((pid, idx) => {
    const info = players[idx] || {};
    return {
      player_number:        pid,
      name:                 info.name || `Player ${pid}`,
      civilization_id:      info.civilization_id || 0,
      feudal_time_ms:       feudalTimes[pid] ?? null,
      feudal_time_formatted:feudalTimes[pid] != null ? msToMMSS(feudalTimes[pid]) : null,
      feudal_clicked:       pid in feudalTimes,
      feudal_pop:           feudalPops[pid] ?? null,
      castle_time_ms:       castleTimes[pid] ?? null,
      castle_time_formatted:castleTimes[pid] != null ? msToMMSS(castleTimes[pid]) : null,
      castle_clicked:       pid in castleTimes,
      build_order:          buildOrders[pid] || [],
    };
  });

  // Add header players with no events
  const pidSet = new Set(allPids);
  players.forEach((p, idx) => {
    const pid = idx + 1;
    if (!pidSet.has(pid)) {
      resultPlayers.push({
        player_number: pid,
        name: p.name || `Player ${pid}`,
        civilization_id: p.civilization_id || 0,
        feudal_time_ms: null, feudal_time_formatted: null, feudal_clicked: false,
        castle_time_ms: null, castle_time_formatted: null, castle_clicked: false,
        build_order: [],
      });
    }
  });

  resultPlayers.sort((a, b) => {
    if (a.feudal_clicked !== b.feudal_clicked) return a.feudal_clicked ? -1 : 1;
    return (a.feudal_time_ms || Infinity) - (b.feudal_time_ms || Infinity);
  });

  return { players: resultPlayers };
}

function msToMMSS(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

// ── Results rendering ─────────────────────────────────────────────────────────
function renderResults(data) {
  loadingSection.classList.add('hidden');
  uploadSection.classList.remove('hidden');

  const ps = data.players || [];
  if (ps.length === 0) {
    showError('No player data found. The file may be corrupt or an unsupported format.');
    return;
  }

  // ── Player summary cards ──
  playerCards.innerHTML = '';
  ps.forEach((p, idx) => {
    const isFastest = idx === 0 && p.feudal_clicked;
    const civName = CIVS[p.civilization_id] || (p.civilization_id ? `Civ #${p.civilization_id}` : '');
    const card = document.createElement('div');
    card.className = 'player-card' + (isFastest ? ' fastest' : '');

    const bClass = isFastest ? 'badge badge-gold' : 'badge badge-dim';
    const bText  = isFastest ? 'Faster Feudal'
                 : p.feudal_clicked ? 'Feudal reached'
                 : 'No Feudal data';

    card.innerHTML = `
      <span class="${bClass}">${bText}</span>
      <div class="player-name" title="${esc(p.name)}">${esc(p.name)}</div>
      ${civName ? `<div class="player-civ">${esc(civName)}</div>` : '<div class="player-civ">&nbsp;</div>'}
      <div class="age-times">
        <div class="age-time-col">
          <span class="age-label">Feudal${p.feudal_pop ? ` <span style="font-weight:400;font-size:10px;text-transform:none;letter-spacing:0;color:var(--text-dim)">${esc(p.feudal_pop)} pop</span>` : ''}</span>
          <div class="age-value ${p.feudal_clicked ? 'has-time' : 'no-time'}">${p.feudal_time_formatted || '—'}</div>
        </div>
        <div class="age-time-col">
          <span class="age-label">Castle</span>
          <div class="age-value ${p.castle_clicked ? 'castle' : 'no-time'}">${p.castle_time_formatted || '—'}</div>
        </div>
      </div>
    `;
    playerCards.appendChild(card);
  });

  // ── Build order columns ──
  buildOrdersEl.innerHTML = '';
  ps.forEach(p => {
    const col = document.createElement('div');
    col.className = 'bo-col';

    const bo = p.build_order || [];
    const unitCount     = bo.filter(e => e.type === 'unit').reduce((s, e) => s + e.amount, 0);
    const buildingCount = bo.filter(e => e.type === 'building').length;
    const techCount     = bo.filter(e => e.type === 'tech').length;
    const metaStr       = bo.length ? `${unitCount}u  ${buildingCount}b  ${techCount}t` : '';

    col.innerHTML = `
      <div class="bo-col-header">
        <span>${esc(p.name)}</span>
        <span class="bo-col-meta">${metaStr}</span>
      </div>
    `;

    const list = document.createElement('div');
    list.className = 'bo-list';

    if (bo.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'bo-empty';
      empty.textContent = p.feudal_clicked
        ? 'Build order not available (non-DE format)'
        : 'No build order data found';
      list.appendChild(empty);
    } else {
      for (const ev of bo) {
        const row = document.createElement('div');
        row.className = `bo-entry bo-${ev.type}`;
        const amountStr = ev.amount > 1 ? `<span class="bo-amount">×${ev.amount}</span>` : '';
        row.innerHTML = `
          <span class="bo-time">${msToMMSS(ev.time_ms)}</span>
          <span class="bo-name">${esc(ev.name)}</span>
          ${amountStr}
        `;
        list.appendChild(row);
      }
    }

    col.appendChild(list);
    buildOrdersEl.appendChild(col);
  });

  const feudalCount  = ps.filter(p => p.feudal_clicked).length;
  const castleCount  = ps.filter(p => p.castle_clicked).length;
  resultMeta.textContent = `${feudalCount}/${ps.length} reached Feudal · ${castleCount}/${ps.length} reached Castle`;
  resultsSection.classList.remove('hidden');
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

showHome();
</script>
