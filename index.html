<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AoE2 Build Order</title>
  <style>
    :root {
      --bg:         #0f0f0f;
      --surface:    #1a1a1a;
      --surface2:   #242424;
      --border:     #333;
      --accent:     #c89648;
      --accent-dim: #8a6530;
      --text:       #e8e8e8;
      --text-dim:   #888;
      --error:      #e05c5c;
      --success:    #5ce07a;
      --tech:       #5bb5e0;
      --build:      #a87fd4;
      --radius:     12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      min-height: 100dvh;
      padding-bottom: 48px;
    }
    .container { max-width: 740px; margin: 0 auto; padding: 0 16px; }

    header { padding: 32px 0 24px; text-align: center; }
    header h1 {
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 700; color: var(--accent); letter-spacing: -0.5px;
    }
    header p { margin-top: 6px; font-size: 14px; color: var(--text-dim); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 18px;
      margin-bottom: 14px;
    }
    .card h2 {
      font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-dim); margin-bottom: 14px;
    }

    label { display: block; font-size: 14px; font-weight: 500; color: var(--text-dim); margin-bottom: 8px; }

    input[type="file"] {
      width: 100%;
      background: var(--surface2);
      border: 1px dashed var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 15px;
      padding: 14px;
      cursor: pointer;
      -webkit-appearance: none;
      display: block;
    }
    .hint { margin-top: 8px; font-size: 12px; color: var(--text-dim); }

    button {
      background: var(--accent);
      border: none; border-radius: 8px;
      color: #0f0f0f; cursor: pointer;
      font-size: 15px; font-weight: 700;
      min-height: 48px; padding: 0 22px;
      touch-action: manipulation;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { opacity: 0.8; }
    button:disabled { background: var(--accent-dim); cursor: not-allowed; opacity: 0.6; }
    .btn-full { width: 100%; margin-top: 14px; }
    .btn-secondary {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text); font-weight: 500;
      width: 100%; margin-top: 12px;
    }

    #loading-section { text-align: center; padding: 48px 0; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 18px;
      animation: spin 0.8s linear infinite;
    }
    #loading-text { color: var(--text-dim); font-size: 15px; }

    #error-section {
      background: color-mix(in srgb, var(--error) 12%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--error) 40%, transparent);
      border-radius: var(--radius);
      padding: 22px 18px; margin-bottom: 14px;
    }
    #error-message { color: var(--error); font-size: 15px; margin-bottom: 14px; }

    /* ── Players grid ── */
    .players-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px; align-items: start;
    }
    @media (max-width: 500px) { .players-grid { grid-template-columns: 1fr; } }

    .player-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .player-panel.highlight { border-color: var(--accent); }

    .player-header { padding: 14px 14px 12px; border-bottom: 1px solid var(--border); }
    .player-badge-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .badge {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 20px;
    }
    .badge-gold {
      background: color-mix(in srgb, var(--accent) 20%, transparent);
      color: var(--accent); border: 1px solid var(--accent-dim);
    }
    .badge-dim {
      background: var(--surface2);
      color: var(--text-dim); border: 1px solid var(--border);
    }
    .player-name {
      font-size: 16px; font-weight: 700;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .player-civ { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

    /* ── Age timing grid ── */
    .age-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px; background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .age-cell { background: var(--surface); padding: 10px 12px; }
    .age-cell-label {
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 3px;
    }
    .age-cell-value {
      font-size: 20px; font-weight: 800;
      letter-spacing: -0.5px; font-variant-numeric: tabular-nums;
    }
    .age-cell-value.val-feudal { color: var(--accent); }
    .age-cell-value.val-castle { color: var(--tech); }
    .age-cell-value.val-none   { color: var(--text-dim); font-size: 15px; font-weight: 400; }

    /* ── Build order table ── */
    /* col widths: time dot name F W G S pop */
    .bo-header-row,
    .bo-row {
      display: grid;
      grid-template-columns: 40px 8px 1fr 22px 22px 22px 22px 26px;
      align-items: center;
      gap: 4px; padding: 4px 10px;
    }
    .bo-header-row {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      padding-top: 7px; padding-bottom: 5px;
      position: sticky; top: 0;
      background: var(--surface); z-index: 1;
    }
    .bo-list {
      padding: 0 0 6px;
      max-height: 380px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .bo-list:empty::after {
      content: 'No build order recorded';
      display: block; padding: 14px; font-size: 13px; color: var(--text-dim);
    }
    .bo-row { border-radius: 3px; }
    .bo-row:hover { background: var(--surface2); }
    .bo-time {
      font-variant-numeric: tabular-nums;
      color: var(--text-dim); font-size: 11px; text-align: right;
    }
    .bo-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; justify-self: center;
    }
    .bo-dot-age    { background: var(--accent); }
    .bo-dot-unit   { background: var(--success); }
    .bo-dot-build  { background: var(--build); }
    .bo-dot-tech   { background: var(--tech); }
    .bo-dot-gather { background: #e08030; }

    .bo-name { color: var(--text); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bo-name-age    { color: var(--accent); font-weight: 600; }
    .bo-name-build  { color: var(--build); }
    .bo-name-tech   { color: var(--tech); }
    .bo-name-gather { color: #e08030; }

    .res-cell {
      font-size: 11px; font-variant-numeric: tabular-nums; text-align: center;
    }
    .res-cell.zero { color: var(--border); }
    .res-f   { color: #c89648; }
    .res-w   { color: #5ce07a; }
    .res-g   { color: #f0d060; }
    .res-s   { color: #aaaaaa; }
    .res-pop { color: var(--text-dim); font-size: 11px; text-align: center; }

    .tc-idle-row {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px 8px;
      font-size: 11px; color: var(--text-dim);
      border-top: 1px solid var(--border);
    }
    .tc-idle-val { color: var(--error); font-weight: 700; }

    /* ── Legend / meta ── */
    .match-meta {
      font-size: 13px; color: var(--text-dim);
      text-align: center; margin-bottom: 18px;
      display: flex; justify-content: center; gap: 18px; flex-wrap: wrap;
    }
    .legend {
      display: flex; gap: 14px; flex-wrap: wrap;
      justify-content: center; margin: 14px 0 18px;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-dim); }
    .legend-dot  { width: 8px; height: 8px; border-radius: 50%; }

    .hidden { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-6px); }
      40%,80%  { transform: translateX(6px); }
    }
  </style>
</head>

async function handleAnalyze() {
  const file = fileInput.files[0];
  if (!file) {
    fileInput.style.borderColor = 'var(--error)';
    setTimeout(() => fileInput.style.borderColor = '', 1500);
    return;
  }
  startLoading();
  try {
    const buf = await file.arrayBuffer();
    let recordBuf = buf;
    if (isZip(buf)) recordBuf = await extractFromZip(buf);
    const result = await parseReplay(recordBuf);
    stopLoading();
    renderResults(result);
  } catch(e) {
    showError(e.message || String(e));
  }

function isZip(buf) {
  const b = new Uint8Array(buf, 0, 4);
  return b[0]===0x50 && b[1]===0x4B && b[2]===0x03 && b[3]===0x04;
}

async function extractFromZip(buf) {
  const bytes = new Uint8Array(buf);
  const view  = new DataView(buf);
  for (let i = 0; i < bytes.length - 30; i++) {
    if (bytes[i]===0x50 && bytes[i+1]===0x4B && bytes[i+2]===0x03 && bytes[i+3]===0x04) {
      const compression      = view.getUint16(i + 8, true);
      const compressedSize   = view.getUint32(i + 18, true);
      const uncompressedSize = view.getUint32(i + 22, true);
      const fnameLen         = view.getUint16(i + 26, true);
      const extraLen         = view.getUint16(i + 28, true);
      const dataOffset       = i + 30 + fnameLen + extraLen;
      const fname = new TextDecoder().decode(bytes.slice(i + 30, i + 30 + fnameLen)).toLowerCase();
      if (fname.endsWith('.aoe2record') || fname.endsWith('.mgz')) {
        const entryData = bytes.slice(dataOffset, dataOffset + compressedSize);
        if (compression === 0) {
          return entryData.buffer.slice(entryData.byteOffset, entryData.byteOffset + entryData.byteLength);
        } else if (compression === 8) {
          const ds = new DecompressionStream('deflate-raw');
          const writer = ds.writable.getWriter();
          const reader = ds.readable.getReader();
          writer.write(entryData);
          writer.close();
          return await readAllChunks(reader);
        }
        throw new Error(`Unsupported ZIP compression ${compression}`);
      }
    }
  }
  throw new Error('No .aoe2record file found inside the ZIP');
}

async function readAllChunks(reader) {
  const chunks = [];
  let total = 0;
  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    chunks.push(value); total += value.length;
  }
  const out = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out.buffer;
}

// ── AoE2 Replay Parser ────────────────────────────────────────────────────────
async function parseReplay(buf) {
  const bytes = new Uint8Array(buf);
  const view  = new DataView(buf);
  const size  = buf.byteLength;

  if (size < 8) throw new Error('File too small to be a valid replay');

  const headerLen = view.getUint32(0, true);
  if (headerLen >= size) throw new Error(`Invalid header length ${headerLen}`);

  let players = [];
  try { players = await extractPlayerInfo(bytes.slice(8, headerLen)); } catch(_) {}

  const opsStart = skipMeta(view, headerLen, size);
  const opsResult = parseOps(view, bytes, opsStart, size);
  return buildResult(players, opsResult);
}

function skipMeta(view, offset, size) {
  if (offset + 40 > size) return offset;
  const first = view.getUint32(offset, true);
  let pos = offset + 4;
  if (first !== 500) pos += 4;
  pos += 20;
  if (pos + 12 > size) return pos;
  const a = view.getUint32(pos, true);
  const b = view.getUint32(pos + 4, true);
  pos += 12;
  if (a !== 0) pos -= 12;
  if (b === 2) pos -= 8;
  return pos;
}

function syncSize(view, offset, bufSize) {
  if (offset + 8 > bufSize) return { inc: 0, size: 4 };
  const inc    = view.getUint32(offset,     true);
  const marker = view.getUint32(offset + 4, true);
  if (marker !== 0) return { inc, size: 4 };
  if (offset + 24 > bufSize) return { inc, size: 32 };
  const is_de = view.getUint32(offset + 20, true);
  if (!is_de) return { inc, size: 32 };
  return { inc, size: 364 };
}

function parseOps(view, bytes, start, size) {
  let offset = start;
  let timeMs = 0;
  const feudalTimes = {};
  const feudalPops  = {};
  const castleTimes = {};
  const buildOrders = {};
  const tcIdleLogs  = {};  // pid -> [{start, end}] TC production windows
  const bQueues     = {};
  const res         = {};
  const pop         = {};

  function initPlayer(pid) {
    if (!res[pid]) {
      res[pid] = { food:200, wood:200, gold:0, stone:0, lastTime:0, vills:3 };
      pop[pid] = { pop:3, cap:5 };
      tcIdleLogs[pid] = [];
    }
  }

  function advanceRes(pid, toMs) {
    const r = res[pid];
    const dt = toMs - r.lastTime;
    if (dt <= 0) return;
    r.food += r.vills * 0.6 * 20 / 60000 * dt;
    r.wood += r.vills * 0.4 * 18 / 60000 * dt;
    r.lastTime = toMs;
  }

  function canAfford(pid, cost, n) {
    const r = res[pid];
    return r.food >= cost[0]*n && r.wood >= cost[1]*n && r.gold >= cost[2]*n && r.stone >= cost[3]*n;
  }

  function spend(pid, cost, n) {
    const r = res[pid];
    r.food  = Math.max(0, r.food  - cost[0]*n);
    r.wood  = Math.max(0, r.wood  - cost[1]*n);
    r.gold  = Math.max(0, r.gold  - cost[2]*n);
    r.stone = Math.max(0, r.stone - cost[3]*n);
  }

  function tryQueue(pid, bKey, unitId, wantAmount, now) {
    if (!bQueues[pid]) bQueues[pid] = {};
    if (!bQueues[pid][bKey]) bQueues[pid][bKey] = [];
    const q = bQueues[pid][bKey];
    const trainMs = TRAIN_MS[unitId] || 32000;
    while (q.length > 0 && q[0] <= now) q.shift();
    const slots = 10 - q.length;
    if (slots <= 0) return 0;
    const actual = Math.min(wantAmount, slots);
    for (let k = 0; k < actual; k++) {
      const prev = q.length > 0 ? q[q.length - 1] : now;
      q.push(prev + trainMs);
    }
    return actual;
  }

  function logTCVil(pid, bKey, nQueued) {
    // Log the actual training window for each villager queued
    const q = (bQueues[pid] && bQueues[pid][bKey]) ? bQueues[pid][bKey] : [];
    const trainMs = TRAIN_MS[83];
    for (let i = q.length - nQueued; i < q.length; i++) {
      if (i >= 0) {
        const finish = q[i];
        tcIdleLogs[pid].push({ start: finish - trainMs, end: finish });
      }
    }
  }

  function add(pid, ev) {
    if (!buildOrders[pid]) buildOrders[pid] = [];
    buildOrders[pid].push(ev);
  }

  outer: while (offset + 4 < size) {
    const opType = view.getUint32(offset, true);
    offset += 4;

    switch (opType) {
      case 1: {
        if (offset + 4 > size) break outer;
        const length = view.getUint32(offset, true);
        offset += 4;
        if (length < 1 || offset + length + 4 > size) break outer;

        const actionId = bytes[offset];
        const abStart  = offset + 1;
        const abLen    = length - 1;
        const innerLen  = abLen >= 3 ? view.getInt16(abStart + 1, true) : -1;
        const isDE71094 = abLen >= 3 && innerLen >= 0 && (innerLen + 3) === abLen;

        // RESEARCH 0x65
        if (actionId === 0x65 && abLen >= 10) {
          let pid, tech_id;
          if (isDE71094) {
            pid     = view.getInt8(abStart);
            tech_id = view.getInt16(abStart + 9, true);
          } else {
            pid     = view.getInt16(abStart + 7, true);
            tech_id = abLen >= 19 ? view.getUint32(abStart + 11, true)
                                  : view.getInt16(abStart + 9,  true);
          }
          if (pid > 0 && pid <= 8 && tech_id > 0) {
            initPlayer(pid);
            advanceRes(pid, timeMs);
            const beforeCastle = !(pid in castleTimes);
            const cost = TECH_COSTS[tech_id] || [0,0,0,0];
            if (beforeCastle && (tech_id in TECH_COSTS ? canAfford(pid, cost, 1) : true)) {
              spend(pid, cost, 1);
              const isAge = tech_id === 101 || tech_id === 102 || tech_id === 103;
              add(pid, { time_ms:timeMs, type:isAge?'age':'tech', id:tech_id, name:TECHS[tech_id]||`Tech #${tech_id}`, amount:1 });
              if (tech_id === 101 && !(pid in feudalTimes)) {
                feudalTimes[pid] = timeMs;
                feudalPops[pid]  = `${pop[pid].pop}/${pop[pid].cap}`;
              }
              if (tech_id === 102 && !(pid in castleTimes)) castleTimes[pid] = timeMs;
            } else if (!beforeCastle) {
              if (tech_id === 101 && !(pid in feudalTimes)) { feudalTimes[pid] = timeMs; feudalPops[pid] = `${pop[pid].pop}/${pop[pid].cap}`; }
              if (tech_id === 102 && !(pid in castleTimes)) castleTimes[pid] = timeMs;
            }
          }
        }

        // BUILD 0x66
        else if (actionId === 0x66 && isDE71094 && abLen >= 19) {
          const pid = view.getInt8(abStart);
          if (pid > 0 && pid <= 8 && !(pid in castleTimes)) {
            initPlayer(pid);
            advanceRes(pid, timeMs);
            const building_id = view.getUint32(abStart + 15, true);
            if (building_id > 0 && building_id < 5000) {
              const cost = BUILDING_COSTS[building_id] || [0,75,0,0];
              if (canAfford(pid, cost, 1)) {
                spend(pid, cost, 1);
                if (building_id === 70) pop[pid].cap += 5;
                add(pid, { time_ms:timeMs, type:'building', id:building_id, name:BUILDINGS[building_id]||`Building #${building_id}`, amount:1 });
              }
            }
          }
        }

        // DE_QUEUE 0x81
        else if (actionId === 0x81 && isDE71094 && abLen >= 16) {
          const pid = view.getInt8(abStart);
          if (pid > 0 && pid <= 8 && !(pid in castleTimes)) {
            initPlayer(pid);
            advanceRes(pid, timeMs);
            const selected = Math.max(0, view.getInt16(abStart + 3, true));
            const unit_id  = view.getInt16(abStart + 11, true);
            const want     = Math.max(1, view.getInt16(abStart + 13, true));
            if (unit_id > 0 && unit_id < 3000) {
              const cost = UNIT_COSTS[unit_id] || [60,0,0,0];
              if (canAfford(pid, cost, want) && pop[pid].pop < pop[pid].cap) {
                let totalActual = 0;
                const nBuildings = selected > 0 ? selected : 1;
                for (let bi = 0; bi < nBuildings; bi++) {
                  const bOff = abStart + 19 + bi * 4;
                  const bKey = (selected > 0 && bOff + 4 <= offset + length)
                    ? view.getUint32(bOff, true)
                    : (pid * 100 + bi);
                  const n = tryQueue(pid, bKey, unit_id, want, timeMs);
                  totalActual += n;
                  if (n > 0 && unit_id === 83) logTCVil(pid, bKey, n);
                }
                if (totalActual > 0) {
                  spend(pid, cost, totalActual);
                  pop[pid].pop += totalActual;
                  if (unit_id === 83) res[pid].vills += totalActual;
                  add(pid, { time_ms:timeMs, type:'unit', id:unit_id, name:UNITS[unit_id]||`Unit #${unit_id}`, amount:totalActual, pop:`${pop[pid].pop}/${pop[pid].cap}` });
                }
              }
            }
          }
        }

        // MAKE 0x64
        else if (actionId === 0x64 && isDE71094 && abLen >= 13) {
          const pid = view.getInt8(abStart);
          if (pid > 0 && pid <= 8 && !(pid in castleTimes)) {
            initPlayer(pid);
            advanceRes(pid, timeMs);
            const bType   = view.getUint16(abStart + 3, true);
            const unit_id = view.getInt16(abStart + 11, true);
            if (unit_id > 0 && unit_id < 3000) {
              const cost = UNIT_COSTS[unit_id] || [60,0,0,0];
              if (canAfford(pid, cost, 1) && pop[pid].pop < pop[pid].cap) {
                const bKey   = pid * 10000 + bType;
                const actual = tryQueue(pid, bKey, unit_id, 1, timeMs);
                if (actual > 0) {
                  spend(pid, cost, actual);
                  pop[pid].pop += actual;
                  if (unit_id === 83) { res[pid].vills += actual; logTCVil(pid, bKey, actual); }
                  add(pid, { time_ms:timeMs, type:'unit', id:unit_id, name:UNITS[unit_id]||`Unit #${unit_id}`, amount:1, pop:`${pop[pid].pop}/${pop[pid].cap}` });
                }
              }
            }
          }
        }

        offset += length + 4;
        break;
      }
      case 2: {
        const { inc, size: sz } = syncSize(view, offset, size);
        timeMs += inc; offset += sz;
        break;
      }
      case 3: { offset += 12; break; }
      case 4: {
        if (offset + 8 > size) break outer;
        const msgLen = view.getUint32(offset + 4, true);
        offset += 8 + msgLen;
        break;
      }
      case 5: break outer;
      default: break outer;
    }
  }

  return { feudalTimes, feudalPops, castleTimes, buildOrders, tcIdleLogs };
}

async function extractPlayerInfo(compressed) {
  const ds = new DecompressionStream('deflate-raw');
  const writer = ds.writable.getWriter();
  const reader = ds.readable.getReader();
  writer.write(compressed);
  writer.close();
  const decompBuf    = await readAllChunks(reader);
  const decompressed = new Uint8Array(decompBuf);
  const dv           = new DataView(decompBuf);

  const strings = [];
  for (let i = 0; i + 4 < decompressed.length; i++) {
    if (decompressed[i] === 0x60 && decompressed[i + 1] === 0x0A) {
      const len = dv.getUint16(i + 2, true);
      if (len > 0 && len < 64 && i + 4 + len <= decompressed.length) {
        const strBytes = decompressed.slice(i + 4, i + 4 + len);
        if (strBytes.every(b => b >= 32 && b < 128)) {
          strings.push(new TextDecoder().decode(strBytes).trim());
        }
      }
    }
  }

  const SKIP = new Set(['Gaia','GAIA','','MP Random','Random','Scenario','Regicide',
    'King of the Hill','Wonder Race','Defend the Wonder','Turbo Random Map',
    'Capture the Relic','Sudden Death','Fortress','Empire Wars','Battle on Ice',
    'Nomad','Arabia','Arena']);
  const names = strings.filter(s =>
    s.length >= 2 && s.length < 40 && !SKIP.has(s) &&
    !s.startsWith('SUBSCRIBEDMODS') && !s.includes(':') && !/^[\d.]+$/.test(s)
  );
  const seen = new Set();
  const result = [];
  for (const n of names) {
    if (!seen.has(n)) { seen.add(n); result.push({name:n, civilization_id:0}); if (result.length===2) break; }
  }
  return result;
}

function calcTcIdle(intervals, endMs) {
  if (!intervals || !intervals.length) return endMs;
  const sorted = intervals.slice().sort((a,b) => a.start - b.start);
  let cs = sorted[0].start, ce = sorted[0].end;
  const merged = [];
  for (const {start:s, end:e} of sorted.slice(1)) {
    if (s <= ce) { ce = Math.max(ce, e); }
    else { merged.push({s:cs,e:ce}); cs=s; ce=e; }
  }
  merged.push({s:cs,e:ce});
  let idle = merged[0].s;
  for (let i = 1; i < merged.length; i++) idle += merged[i].s - merged[i-1].e;
  idle += Math.max(0, endMs - merged[merged.length-1].e);
  return idle;
}

function buildResult(players, { feudalTimes, feudalPops, castleTimes, buildOrders, tcIdleLogs }) {
  const allPids = [...new Set([
    ...Object.keys(feudalTimes).map(Number),
    ...Object.keys(buildOrders).map(Number),
  ])].sort();

  if (allPids.length === 0 && players.length === 0)
    return { players: [] };

  const resultPlayers = allPids.map((pid, idx) => {
    const info = players[idx] || {};
    const fclick = feudalTimes[pid] ?? null;
    const tcIdle = calcTcIdle(tcIdleLogs[pid] || [], fclick || 600000);
    return {
      player_number:        pid,
      name:                 info.name || `Player ${pid}`,
      civilization_id:      info.civilization_id || 0,
      feudal_click_ms:      fclick,
      feudal_click_str:     fclick != null ? msToMMSS(fclick) : null,
      feudal_clicked:       pid in feudalTimes,
      feudal_pop:           feudalPops[pid] ?? null,
      castle_click_ms:      castleTimes[pid] ?? null,
      castle_click_str:     castleTimes[pid] != null ? msToMMSS(castleTimes[pid]) : null,
      castle_clicked:       pid in castleTimes,
      tc_idle_ms:           tcIdle,
      tc_idle_str:          msToMMSS(tcIdle),
      build_order:          buildOrders[pid] || [],
    };
  });

  const pidSet = new Set(allPids);
  players.forEach((p, idx) => {
    const pid = idx + 1;
    if (!pidSet.has(pid)) {
      resultPlayers.push({
        player_number:pid, name:p.name||`Player ${pid}`, civilization_id:0,
        feudal_click_ms:null, feudal_click_str:null, feudal_clicked:false,
        castle_click_ms:null, castle_click_str:null, castle_clicked:false,
        tc_idle_ms:0, tc_idle_str:'0:00', build_order:[],
      });
    }
  });

  resultPlayers.sort((a,b) => {
    if (a.feudal_clicked !== b.feudal_clicked) return a.feudal_clicked ? -1 : 1;
    return (a.feudal_click_ms||Infinity) - (b.feudal_click_ms||Infinity);
  });

  return { players: resultPlayers };
}

function msToMMSS(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

// ── Results rendering ─────────────────────────────────────────────────────────
function renderResults(data) {
  loadingSection.classList.add('hidden');
  uploadSection.classList.remove('hidden');

  const ps = data.players || [];
  if (!ps.length) {
    showError('No player data found. The file may be corrupt or an unsupported format.');
    return;
  }

  matchMeta.innerHTML = '';
  playersGrid.innerHTML = '';

  const fastestIdx = ps.findIndex(p => p.feudal_clicked);

  ps.forEach((p, idx) => {
    const isFastest = idx === fastestIdx && p.feudal_clicked;
    const civName   = CIVS[p.civilization_id] || (p.civilization_id ? `Civ #${p.civilization_id}` : '');

    const panel = document.createElement('div');
    panel.className = 'player-panel' + (isFastest ? ' highlight' : '');

    const badgeHtml = isFastest
      ? `<span class="badge badge-gold">⚡ Faster Feudal</span>`
      : `<span class="badge badge-dim">${p.feudal_clicked ? 'Feudal reached' : 'No feudal data'}</span>`;

    const boHtml = buildOrderHtml(p.build_order || []);

    panel.innerHTML = `
      <div class="player-header">
        <div class="player-badge-row">${badgeHtml}</div>
        <div class="player-name" title="${esc(p.name)}">${esc(p.name)}</div>
        <div class="player-civ">${esc(civName)}</div>
      </div>
      <div class="age-grid">
        <div class="age-cell">
          <div class="age-cell-label">Feudal Click</div>
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <div class="age-cell-value ${p.feudal_clicked ? 'val-feudal' : 'val-none'}">${p.feudal_click_str || '—'}</div>
            ${p.feudal_pop ? `<div style="font-size:11px;color:var(--text-dim)">${esc(p.feudal_pop)}</div>` : ''}
          </div>
        </div>
        <div class="age-cell">
          <div class="age-cell-label">Castle Click</div>
          <div class="age-cell-value ${p.castle_clicked ? 'val-castle' : 'val-none'}">${p.castle_click_str || '—'}</div>
        </div>
      </div>
      <div class="bo-list">${boHtml}</div>
      <div class="tc-idle-row">
        TC idle up to feudal: <span class="tc-idle-val">${esc(p.tc_idle_str || '—')}</span>
      </div>
    `;

    playersGrid.appendChild(panel);
  });

  resultsSection.classList.remove('hidden');
}

function buildOrderHtml(bo) {
  if (!bo.length) return '';
  const header = `<div class="bo-header-row">
    <span style="text-align:right">Time</span>
    <span></span>
    <span>Event</span>
    <span></span><span></span><span></span><span></span>
    <span style="text-align:center">Pop</span>
  </div>`;
  const rows = bo.map(item => {
    const t = item.type || 'unit';
    const pv = item.pop || '';
    return `<div class="bo-row">
      <span class="bo-time">${esc(msToMMSS(item.time_ms))}</span>
      <span class="bo-dot bo-dot-${t}"></span>
      <span class="bo-name bo-name-${t}">${esc(item.name||'')}${item.amount > 1 ? ` ×${item.amount}` : ''}</span>
      <span></span><span></span><span></span><span></span>
      <span class="res-pop">${esc(pv)}</span>
    </div>`;
  }).join('');
  return header + rows;
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

showHome();
</script>
