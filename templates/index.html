<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AoE2 Build Order</title>
  <style>
    :root {
      --bg:         #0f0f0f;
      --surface:    #1a1a1a;
      --surface2:   #242424;
      --border:     #333;
      --accent:     #c89648;
      --accent-dim: #8a6530;
      --text:       #e8e8e8;
      --text-dim:   #888;
      --error:      #e05c5c;
      --success:    #5ce07a;
      --tech:       #5bb5e0;
      --build:      #a87fd4;
      --radius:     12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      min-height: 100dvh;
      padding-bottom: 48px;
    }

    .container {
      max-width: 740px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ── Header ── */
    header {
      padding: 32px 0 24px;
      text-align: center;
    }
    header h1 {
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    header p {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text-dim);
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 18px;
      margin-bottom: 14px;
    }
    .card h2 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    /* ── Inputs ── */
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 16px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"].shake { animation: shake 0.35s ease; border-color: var(--error); }
    input[type="file"] {
      width: 100%;
      background: var(--surface2);
      border: 1px dashed var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 15px;
      padding: 14px;
      cursor: pointer;
      -webkit-appearance: none;
    }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* ── Buttons ── */
    button {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #0f0f0f;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      min-height: 48px;
      padding: 0 22px;
      touch-action: manipulation;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { opacity: 0.8; }
    button:disabled { background: var(--accent-dim); cursor: not-allowed; opacity: 0.6; }
    .btn-secondary {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 500;
      width: 100%;
      margin-top: 12px;
    }
    .btn-secondary:active { background: var(--border); }

    /* ── Upload collapsible ── */
    details > summary {
      cursor: pointer;
      font-size: 14px;
      color: var(--text-dim);
      padding: 4px 0;
      list-style: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    details > summary::before { content: '▶  '; font-size: 10px; }
    details[open] > summary::before { content: '▼  '; }
    details > summary::-webkit-details-marker { display: none; }
    .upload-inner {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .upload-inner button { width: 100%; }

    /* ── Loading ── */
    #loading-section {
      text-align: center;
      padding: 40px 0;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 18px;
      animation: spin 0.8s linear infinite;
    }
    #loading-text { color: var(--text-dim); font-size: 15px; }

    /* ── Error ── */
    #error-section {
      background: color-mix(in srgb, var(--error) 12%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--error) 40%, transparent);
      border-radius: var(--radius);
      padding: 22px 18px;
      margin-bottom: 14px;
    }
    #error-message { color: var(--error); font-size: 15px; margin-bottom: 14px; }

    /* ── Info banner ── */
    .info-banner {
      background: color-mix(in srgb, var(--accent) 12%, var(--surface));
      border: 1px solid var(--accent-dim);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    /* ── Results meta bar ── */
    .match-meta {
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
      margin-bottom: 18px;
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .match-meta span { white-space: nowrap; }

    /* ── Players grid ── */
    .players-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 500px) {
      .players-grid { grid-template-columns: 1fr; }
    }

    /* ── Player panel ── */
    .player-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .player-panel.highlight { border-color: var(--accent); }

    .player-header {
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--border);
    }
    .player-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 20px;
    }
    .badge-gold { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); border: 1px solid var(--accent-dim); }
    .badge-dim  { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }

    .player-name {
      font-size: 16px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .player-civ {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* ── Age timing grid ── */
    .age-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .age-cell {
      background: var(--surface);
      padding: 10px 12px;
    }
    .age-cell-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 3px;
    }
    .age-cell-value {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
    }
    .age-cell-value.val-feudal { color: var(--accent); }
    .age-cell-value.val-castle { color: var(--tech); }
    .age-cell-value.val-none   { color: var(--text-dim); font-size: 15px; font-weight: 400; }

    /* ── Build order table ── */
    .bo-list {
      padding: 0 0 6px;
      max-height: 380px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .bo-list:empty::after {
      content: 'No build order recorded';
      display: block;
      padding: 14px 14px;
      font-size: 13px;
      color: var(--text-dim);
    }
    /* col widths: time dot name F W G S pop */
    .bo-header-row,
    .bo-row {
      display: grid;
      grid-template-columns: 40px 8px 1fr 22px 22px 22px 22px 26px;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
    }
    .bo-header-row {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      padding-top: 7px;
      padding-bottom: 5px;
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 1;
    }
    .bo-row { border-radius: 3px; }
    .bo-row:hover { background: var(--surface2); }
    .bo-time {
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
      font-size: 11px;
      text-align: right;
    }
    .bo-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      justify-self: center;
    }
    /* Resource number cells */
    .res-cell {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    .res-cell.zero { color: var(--border); }
    .res-f   { color: #c89648; }
    .res-w   { color: #5ce07a; }
    .res-g   { color: #f0d060; }
    .res-s   { color: #aaaaaa; }
    .res-pop { color: var(--text-dim); font-size: 11px; text-align: center; }
    /* TC idle stat below build order */
    .tc-idle-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px 8px;
      font-size: 11px;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
    }
    .tc-idle-val { color: var(--error); font-weight: 700; }
    .bo-dot-age    { background: var(--accent); }
    .bo-dot-unit   { background: var(--success); }
    .bo-dot-build  { background: var(--build); }
    .bo-dot-tech   { background: var(--tech); }
    .bo-dot-gather { background: #e08030; }

    .bo-name { color: var(--text); }
    .bo-name-age    { color: var(--accent); font-weight: 600; }
    .bo-name-unit   { }
    .bo-name-build  { color: var(--build); }
    .bo-name-tech   { color: var(--tech); }
    .bo-name-gather { color: #e08030; }

    .bo-amount {
      font-size: 12px;
      color: var(--text-dim);
      text-align: right;
    }
    .bo-amount-unit { color: var(--success); font-weight: 600; }

    /* ── Legend ── */
    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 14px 0 18px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .legend-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }

    /* ── Utilities ── */
    .hidden { display: none !important; }

    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>AoE2 Build Order</h1>
    <p>Accurate build orders from replay files — spam clicks filtered</p>
  </header>

  <!-- Search by username -->
  <div class="card" id="search-section">
    <h2>Search by player name</h2>
    <form id="search-form" autocomplete="off">
      <label for="username-input">aoe2.net username</label>
      <div class="input-row">
        <input id="username-input" type="text" placeholder="e.g. TheViper"
               autocapitalize="none" autocorrect="off" spellcheck="false">
        <button type="submit" id="search-btn">Fetch &amp; Analyze</button>
      </div>
      <p class="hint">Fetches most recent 1v1 · replay URL may not always be available</p>
    </form>
  </div>

  <!-- Upload replay file -->
  <div class="card" id="upload-section">
    <details id="upload-details">
      <summary>Upload replay file directly</summary>
      <div class="upload-inner">
        <div id="upload-banner" class="info-banner hidden"></div>
        <div>
          <label for="file-input">Select .aoe2record or .zip file</label>
          <input id="file-input" type="file" accept=".aoe2record,.zip">
        </div>
        <button type="button" id="upload-btn">Analyze File</button>
      </div>
    </details>
  </div>

  <!-- Loading -->
  <div id="loading-section" class="hidden">
    <div class="spinner"></div>
    <p id="loading-text">Working…</p>
  </div>

  <!-- Error -->
  <div id="error-section" class="hidden">
    <p id="error-message"></p>
    <button class="btn-secondary" id="error-back-btn">← Try Again</button>
  </div>

  <!-- Results -->
  <div id="results-section" class="hidden">

    <div class="match-meta" id="match-meta"></div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div> Age-up</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--success)"></div> Unit</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--build)"></div> Building</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--tech)"></div> Tech</div>
      <div class="legend-item"><div class="legend-dot" style="background:#e08030"></div> Gather</div>
    </div>

    <div class="players-grid" id="players-grid"></div>

    <button class="btn-secondary" id="again-btn" style="margin-top:20px">← Analyze Another</button>

  </div>

</div>
<script>
  const CIVS = {
    1:'Britons',2:'Franks',3:'Goths',4:'Teutons',5:'Japanese',
    6:'Chinese',7:'Byzantines',8:'Persians',9:'Saracens',10:'Turks',
    11:'Vikings',12:'Mongols',13:'Celts',14:'Spanish',15:'Aztecs',
    16:'Mayans',17:'Huns',18:'Koreans',19:'Italians',20:'Hindustanis',
    21:'Incas',22:'Magyars',23:'Slavs',24:'Portuguese',25:'Ethiopians',
    26:'Malians',27:'Berbers',28:'Khmer',29:'Malay',30:'Burmese',
    31:'Vietnamese',32:'Bulgarians',33:'Tatars',34:'Cumans',
    35:'Lithuanians',36:'Burgundians',37:'Sicilians',38:'Poles',
    39:'Bohemians',40:'Dravidians',41:'Bengalis',42:'Gurjaras',
    43:'Romans',44:'Armenians',45:'Georgians',
  };

  const LOADING_MSGS = [
    'Fetching match data…',
    'Downloading replay…',
    'Parsing replay file…',
    'Calculating build orders…',
  ];

  const searchSection  = document.getElementById('search-section');
  const uploadSection  = document.getElementById('upload-section');
  const loadingSection = document.getElementById('loading-section');
  const errorSection   = document.getElementById('error-section');
  const resultsSection = document.getElementById('results-section');
  const usernameInput  = document.getElementById('username-input');
  const searchBtn      = document.getElementById('search-btn');
  const fileInput      = document.getElementById('file-input');
  const uploadBtn      = document.getElementById('upload-btn');
  const uploadDetails  = document.getElementById('upload-details');
  const uploadBanner   = document.getElementById('upload-banner');
  const loadingText    = document.getElementById('loading-text');
  const errorMessage   = document.getElementById('error-message');
  const playersGrid    = document.getElementById('players-grid');
  const matchMeta      = document.getElementById('match-meta');

  document.getElementById('error-back-btn').addEventListener('click', showHome);
  document.getElementById('again-btn').addEventListener('click', showHome);
  document.getElementById('search-form').addEventListener('submit', handleSearch);
  uploadBtn.addEventListener('click', handleUpload);

  function hideAll() {
    [searchSection, uploadSection, loadingSection, errorSection, resultsSection]
      .forEach(el => el.classList.add('hidden'));
  }

  function showHome() {
    hideAll();
    searchSection.classList.remove('hidden');
    uploadSection.classList.remove('hidden');
    uploadBanner.classList.add('hidden');
    uploadDetails.removeAttribute('open');
  }

  let _loadInterval = null;
  function startLoading() {
    hideAll();
    loadingSection.classList.remove('hidden');
    let i = 0;
    loadingText.textContent = LOADING_MSGS[0];
    _loadInterval = setInterval(() => {
      i = (i + 1) % LOADING_MSGS.length;
      loadingText.textContent = LOADING_MSGS[i];
    }, 1600);
    searchBtn.disabled = true;
    uploadBtn.disabled = true;
  }

  function stopLoading() {
    clearInterval(_loadInterval);
    searchBtn.disabled = false;
    uploadBtn.disabled = false;
  }

  function showError(msg) {
    stopLoading();
    hideAll();
    errorMessage.textContent = msg;
    errorSection.classList.remove('hidden');
  }

  async function handleSearch(e) {
    e.preventDefault();
    const username = usernameInput.value.trim();
    if (!username) {
      usernameInput.classList.add('shake');
      usernameInput.addEventListener('animationend', () => usernameInput.classList.remove('shake'), {once:true});
      return;
    }
    startLoading();
    let data;
    try {
      const resp = await fetch('/api/search', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username}),
      });
      data = await resp.json();
    } catch (err) {
      showError('Network error — make sure the server is running.');
      return;
    }
    stopLoading();
    if (data.error === 'no_replay_url') {
      hideAll();
      searchSection.classList.remove('hidden');
      uploadSection.classList.remove('hidden');
      uploadDetails.setAttribute('open', '');
      uploadBanner.textContent = data.message || 'Match found, but no replay URL is available. Upload the file manually.';
      uploadBanner.classList.remove('hidden');
    } else if (data.error) {
      showError(data.detail ? `${data.error}: ${data.detail}` : data.error);
    } else {
      renderResults(data);
    }
  }

  async function handleUpload() {
    const file = fileInput.files[0];
    if (!file) {
      fileInput.style.borderColor = 'var(--error)';
      setTimeout(() => fileInput.style.borderColor = '', 1500);
      return;
    }
    startLoading();
    loadingText.textContent = 'Uploading and parsing…';
    const form = new FormData();
    form.append('file', file);
    let data;
    try {
      const resp = await fetch('/api/upload', {method:'POST', body:form});
      data = await resp.json();
    } catch (err) {
      showError('Network error — make sure the server is running.');
      return;
    }
    stopLoading();
    if (data.error) {
      showError(data.detail ? `${data.error}: ${data.detail}` : data.error);
    } else {
      renderResults(data);
    }
  }

  function renderResults(data) {
    hideAll();

    // Match meta bar
    const parts = [];
    if (data.map_name) parts.push(`🗺 ${esc(data.map_name)}`);
    if (data.speed)    parts.push(`⚡ ${esc(data.speed)}`);
    if (data.duration) parts.push(`⏱ ${esc(fmtDuration(data.duration))}`);
    matchMeta.innerHTML = parts.map(p => `<span>${p}</span>`).join('');

    const players = data.players || [];
    playersGrid.innerHTML = '';

    // Fastest feudal = first player with feudal_clicked (already sorted by server)
    const fastestIdx = players.findIndex(p => p.feudal_clicked);

    players.forEach((p, idx) => {
      const isFastest = idx === fastestIdx && p.feudal_clicked;
      const civName   = p.civilization || CIVS[p.civilization_id] || (p.civilization_id ? `Civ #${p.civilization_id}` : '');

      const panel = document.createElement('div');
      panel.className = 'player-panel' + (isFastest ? ' highlight' : '');

      // Header
      const badgeHtml = isFastest
        ? `<span class="badge badge-gold">⚡ Faster Feudal</span>`
        : `<span class="badge badge-dim">${p.feudal_clicked ? 'Feudal reached' : 'No feudal data'}</span>`;

      // Age timing cells: feudal click, feudal done, castle click, castle done
      const fClickVal  = ageCellVal(p.feudal_click_str,  'val-feudal');
      const fDoneVal   = ageCellVal(p.feudal_done_str,   'val-feudal');
      const cClickVal  = ageCellVal(p.castle_click_str,  'val-castle');
      const cDoneVal   = ageCellVal(p.castle_done_str,   'val-castle');

      // Build order rows
      const boHtml = buildOrderHtml(p.build_order || []);

      panel.innerHTML = `
        <div class="player-header">
          <div class="player-badge-row">${badgeHtml}</div>
          <div class="player-name" title="${esc(p.name)}">${esc(p.name)}</div>
          <div class="player-civ">${esc(civName)}</div>
        </div>
        <div class="age-grid">
          <div class="age-cell">
            <div class="age-cell-label">Feudal Click</div>
            <div style="display:flex;justify-content:space-between;align-items:baseline">
              <div class="age-cell-value ${p.feudal_clicked ? 'val-feudal' : 'val-none'}">${fClickVal}</div>
              <div style="font-size:11px;color:var(--text-dim)">${esc(p.feudal_pop || '?/?')}</div>
            </div>
          </div>
          <div class="age-cell">
            <div class="age-cell-label">Feudal Done</div>
            <div class="age-cell-value ${p.feudal_done_str ? 'val-feudal' : 'val-none'}">${fDoneVal}</div>
          </div>
          <div class="age-cell">
            <div class="age-cell-label">Castle Click</div>
            <div class="age-cell-value ${p.castle_clicked ? 'val-castle' : 'val-none'}">${cClickVal}</div>
          </div>
          <div class="age-cell">
            <div class="age-cell-label">Castle Done</div>
            <div class="age-cell-value ${p.castle_done_str ? 'val-castle' : 'val-none'}">${cDoneVal}</div>
          </div>
        </div>
        <div class="bo-list">${boHtml}</div>
        <div class="tc-idle-row">
          TC idle up to feudal: <span class="tc-idle-val">${esc(p.tc_idle_str || '—')}</span>
        </div>
      `;

      playersGrid.appendChild(panel);
    });

    resultsSection.classList.remove('hidden');
  }

  function ageCellVal(str, cls) {
    return str || '—';
  }

  function buildOrderHtml(bo) {
    if (!bo.length) return '';
    const header = `<div class="bo-header-row">
      <span style="text-align:right">Time</span>
      <span></span>
      <span>Event</span>
      <span style="color:#c89648;text-align:center">F</span>
      <span style="color:#5ce07a;text-align:center">W</span>
      <span style="color:#f0d060;text-align:center">G</span>
      <span style="color:#aaaaaa;text-align:center">S</span>
      <span style="text-align:center">Pop</span>
    </div>`;
    const rows = bo.map(item => {
      const t = item.type || 'unit';
      const dotClass  = `bo-dot bo-dot-${t}`;
      const nameClass = `bo-name bo-name-${t}`;
      const fv = item.food_vils  ?? '';
      const wv = item.wood_vils  ?? '';
      const gv = item.gold_vils  ?? '';
      const sv = item.stone_vils ?? '';
      const pv = item.pop        != null ? item.pop : '';
      function rc(v, cls) {
        if (v === '' || v == null) return `<span class="res-cell"></span>`;
        return `<span class="res-cell ${cls}${v === 0 ? ' zero' : ''}">${v}</span>`;
      }
      return `<div class="bo-row">
        <span class="bo-time">${esc(item.time_str || '')}</span>
        <span class="${dotClass}"></span>
        <span class="${nameClass}">${esc(item.name || '')}</span>
        ${rc(fv,'res-f')}${rc(wv,'res-w')}${rc(gv,'res-g')}${rc(sv,'res-s')}
        <span class="res-pop">${pv}</span>
      </div>`;
    }).join('');
    return header + rows;
  }

  function fmtDuration(dur) {
    // dur is a timedelta string like "0:11:23" or "1:02:10"
    if (!dur) return '';
    const parts = dur.split(':');
    if (parts.length === 3) {
      const h = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      const s = parseInt(parts[2], 10);
      if (h > 0) return `${h}h ${m}m`;
      return `${m}m ${s}s`;
    }
    return dur;
  }

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  showHome();
</script>
</body>
</html>
